<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FasoWatch, ajouter un lien à vérifier</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#F4F6F3;--fg:#14211A;--muted:#5B6B62;--line:#D9E0DA;--accent:#0F6B3A;--red:#C8282A;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E1512;--fg:#E8EEE9;--muted:#98A89F;--line:#25322B;--accent:#4FCB86;--red:#F0686A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 16px}
label{display:block;margin:14px 0 4px;font-weight:600}
input,select,textarea,button{font:inherit;color:inherit;width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:transparent}
textarea{min-height:90px}
button.go{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;margin-top:18px;cursor:pointer}
.err{color:var(--red);min-height:1.5em;margin-top:10px}
.ok{color:var(--accent);min-height:1.5em;margin-top:10px}
.tip{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.tip div{min-width:0;overflow-wrap:anywhere}
.tip small{color:var(--muted)}
.tip button{width:auto;flex:none;cursor:pointer;color:var(--red)}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ajouter un lien à vérifier</h1>
  <p>Pour une information vue sur TikTok, Facebook ou ailleurs. Elle apparaît dans l’onglet « À vérifier », séparée des sources fiables. <a href="/">Retour au site</a></p>
  <label for="pw">Mot de passe admin</label>
  <input id="pw" type="password" autocomplete="current-password">
  <label for="platform">Où as-tu vu cette information ?</label>
  <select id="platform"><option value="tiktok">TikTok</option><option value="facebook">Facebook</option><option value="whatsapp">WhatsApp</option><option value="youtube">YouTube</option><option value="x">X</option><option value="autre">Autre</option></select>
  <label for="url">Lien</label>
  <input id="url" type="url" inputmode="url" placeholder="https://...">
  <label for="title">Titre (une phrase simple)</label>
  <input id="title" maxlength="200">
  <label for="note">Note (facultatif)</label>
  <textarea id="note" maxlength="500" placeholder="Ce qu’il faut vérifier, et où"></textarea>
  <button class="go" id="add">Ajouter</button>
  <div class="err" id="err" role="alert"></div>
  <div class="ok" id="ok" role="status"></div>
  <h2 style="font-size:18px;margin-top:32px">Liens déjà ajoutés</h2>
  <div id="tips"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const pw=()=>$('#pw').value;
function el(tag,attrs={},...kids){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v)}for(const c of kids){if(c!=null)n.append(c.nodeType?c:document.createTextNode(c))}return n}
async function loadTips(){
  try{
    const r=await (await fetch('/api/tips')).json();
    $('#tips').replaceChildren(...(r.items||[]).map(t=>el('div',{class:'tip'},
      el('div',{},el('div',{},t.title),el('small',{},t.platform)),
      el('button',{onclick:()=>del(t.id)},'Supprimer'))));
  }catch{}
}
async function del(id){
  $('#err').textContent='';
  const r=await fetch('/api/tips?id='+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-password':pw()}});
  if(!r.ok){$('#err').textContent=(await r.json().catch(()=>({}))).error||'Erreur';return}
  loadTips();
}
$('#add').addEventListener('click',async()=>{
  $('#err').textContent='';$('#ok').textContent='';
  const body={platform:$('#platform').value,url:$('#url').value,title:$('#title').value,note:$('#note').value};
  const r=await fetch('/api/tips',{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw()},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#err').textContent=j.error||'Erreur';return}
  $('#ok').textContent='Lien ajouté.';
  $('#url').value='';$('#title').value='';$('#note').value='';
  loadTips();
});
loadTips();
</script>
</body>
</html>
